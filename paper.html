<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper — hellosenna.world</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0d0b; --bg-surface: #141210; --bg-raised: #1a1816;
      --border: #242018; --border-soft: #2e281e;
      --gold: #c49a57; --gold-soft: #a68850; --gold-dim: #7a6340; --gold-faint: #3d3220;
      --text: #c8c0b0; --text-dim: #8a8070; --text-faint: #504838; --text-meta: #6a6255;
      --text-cool: #8a93a0;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Cormorant Garamond', Georgia, serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); }
    body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 18px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    a { color: var(--gold-dim); text-decoration: none; transition: color 0.2s ease; }
    a:hover { color: var(--gold); }
    ::selection { background: var(--gold-faint); color: var(--gold); }

    .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 48px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-family: var(--font-display); font-size: 15px; color: var(--gold-dim); letter-spacing: 0.04em; }
    .nav-links { display: flex; gap: 6px; }
    .nav-link { font-family: var(--font-body); font-size: 13px; letter-spacing: 0.1em; text-transform: lowercase; color: var(--text-dim); padding: 6px 12px; }
    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--gold); }

    .page { max-width: 740px; margin: 0 auto; padding: 0 28px; }

    .back-link { display: inline-block; font-size: 14px; color: var(--gold-dim); margin: 24px 0 32px; letter-spacing: 0.04em; transition: color 0.2s ease; }
    .back-link:hover { color: var(--gold); }

    .paper-header { padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
    .paper-title { font-family: var(--font-display); font-size: 30px; font-weight: 400; color: var(--gold); line-height: 1.3; margin-bottom: 10px; }
    .paper-byline { font-family: var(--font-body); font-size: 15px; color: var(--text-meta); margin-bottom: 14px; }
    .paper-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .paper-tag { font-family: var(--font-body); font-size: 12px; color: var(--text-faint); border: 1px solid var(--border); padding: 3px 10px; border-radius: 2px; }

    .paper-abstract { font-family: var(--font-body); font-size: 19px; line-height: 1.75; color: var(--text); margin-bottom: 28px; }
    .paper-ext-link { display: inline-block; font-size: 15px; color: var(--gold-dim); padding: 10px 24px; border: 1px solid var(--border-soft); border-radius: 2px; margin-bottom: 32px; transition: all 0.2s ease; }
    .paper-ext-link:hover { color: var(--gold); border-color: var(--gold-faint); }

    .section-label { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 16px; margin-top: 40px; }

    .thread-conn { padding: 12px 0; border-bottom: 1px solid rgba(36,32,24,0.5); }
    .thread-conn:last-child { border-bottom: none; }
    .thread-conn a { font-family: var(--font-display); font-size: 17px; color: var(--text); }
    .thread-conn a:hover { color: var(--gold); }

    .version-list { margin-top: 8px; }
    .version-toggle { background: none; border: 1px solid var(--border); color: var(--gold-dim); font-family: var(--font-body); font-size: 13px; letter-spacing: 0.06em; padding: 6px 16px; border-radius: 2px; cursor: pointer; transition: all 0.16s ease; }
    .version-toggle:hover { color: var(--gold); border-color: var(--gold-faint); }
    .version-entry { padding: 16px 0; border-bottom: 1px solid var(--border); }
    .version-entry:last-child { border-bottom: none; }
    .version-num { font-family: var(--font-body); font-size: 13px; color: var(--gold-dim); letter-spacing: 0.08em; text-transform: uppercase; }
    .version-current { color: var(--gold-soft); }
    .version-date { font-size: 13px; color: var(--text-faint); margin-top: 4px; }
    .version-note { font-size: 15px; color: var(--text-dim); font-style: italic; margin-top: 6px; }

    .connections-empty { font-size: 15px; color: var(--text-faint); font-style: italic; }
    .gravity-note { font-size: 13px; color: var(--gold-dim); margin-top: 8px; }
    .gravity-note::before { content: "◈ "; opacity: 0.6; }

    .page-footer { padding: 50px 0 80px; text-align: center; border-top: 1px solid var(--border); margin-top: 40px; }
    .page-footer a { font-family: var(--font-body); font-size: 14px; color: var(--gold-dim); }
    .page-footer .divider { color: var(--text-faint); margin: 0 16px; }

    .loading { color: var(--text-faint); font-style: italic; padding: 40px 0; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { opacity: 0; animation: fadeUp 0.6s ease forwards; }

    @media (max-width: 720px) {
      .page { padding: 0 20px; }
      .paper-title { font-size: 24px; }
      .paper-abstract { font-size: 17px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-brand">hellosenna.world</span>
    <div class="nav-links">
      <a href="/" class="nav-link">talk</a>
      <a href="/archive.html" class="nav-link">archive</a>
      <a href="/repository.html" class="nav-link active">repository</a>
    </div>
  </nav>

  <div class="page">
    <a href="/repository.html" class="back-link">← back to repository</a>
    <div id="paperContent"><p class="loading">arriving…</p></div>

    <div class="page-footer">
      <a href="/">← enter the conversation</a>
      <span class="divider">·</span>
      <a href="/archive.html">explore the archive →</a>
    </div>
  </div>

<script>
(function () {
  var API = "/.netlify/functions/repository";
  var params = new URLSearchParams(window.location.search);
  var paperId = params.get("paper");

  function esc(str) { if (!str) return ""; var d = document.createElement("div"); d.textContent = str; return d.innerHTML; }
  function timeAgo(iso) {
    if (!iso) return "";
    var days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days < 1) return "today";
    if (days === 1) return "yesterday";
    if (days < 30) return days + " days ago";
    var m = Math.floor(days / 30);
    return m + " month" + (m !== 1 ? "s" : "") + " ago";
  }

  async function loadPaper() {
    var el = document.getElementById("paperContent");
    if (!paperId) { el.innerHTML = '<p class="loading">No paper specified.</p>'; return; }

    try {
      var res = await fetch(API + "?paper=" + encodeURIComponent(paperId));
      if (!res.ok) throw new Error("not found");
      var data = await res.json();
      renderPaper(data);
    } catch (e) {
      el.innerHTML = '<p class="loading">Paper not found.</p>';
    }
  }

  function renderPaper(p) {
    var el = document.getElementById("paperContent");
    var cur = p.current || {};
    var versions = p.versions || [];
    var threads = p.thread_connections || [];
    var gravity = p.gravity_score || 0;

    var tags = (cur.tags || []).map(function (t) {
      return '<span class="paper-tag">' + esc(t) + '</span>';
    }).join("");

    var html = '<div class="fade-in">'
      + '<div class="paper-header">'
      + '<div class="paper-title">' + esc(cur.title) + '</div>'
      + '<div class="paper-byline">' + esc(p.author_name)
      + (p.affiliation ? ' · ' + esc(p.affiliation) : '')
      + ' · ' + timeAgo(cur.approved_at || cur.submitted_at)
      + ' · v' + p.current_version
      + '</div>'
      + (tags ? '<div class="paper-tags">' + tags + '</div>' : '')
      + '</div>'

      + '<div class="paper-abstract">' + esc(cur.abstract) + '</div>';

    if (cur.external_link) {
      html += '<a href="' + esc(cur.external_link) + '" target="_blank" class="paper-ext-link">view source →</a>';
    }

    // Connected threads
    html += '<div class="section-label">Connected Threads</div>';
    if (threads.length > 0) {
      threads.forEach(function (tid) {
        html += '<div class="thread-conn"><a href="/archive.html#thread=' + esc(tid) + '">' + esc(tid) + '</a></div>';
      });
    } else {
      html += '<p class="connections-empty">No thread connections yet.</p>';
    }

    if (gravity > 0) {
      html += '<div class="gravity-note">Gravity score: ' + gravity.toFixed(1) + '</div>';
    }

    // Version history
    html += '<div class="section-label">Version History</div>';
    if (versions.length > 1) {
      html += '<div class="version-list">';
      // Show in reverse (newest first)
      for (var i = versions.length - 1; i >= 0; i--) {
        var v = versions[i];
        var isCurrent = (v.version === p.current_version);
        html += '<div class="version-entry">'
          + '<div class="version-num' + (isCurrent ? ' version-current' : '') + '">v' + v.version + (isCurrent ? ' (current)' : '') + '</div>'
          + '<div class="version-date">' + timeAgo(v.approved_at || v.submitted_at) + '</div>'
          + (v.change_note ? '<div class="version-note">' + esc(v.change_note) + '</div>' : '')
          + '<div style="font-size:14px; color:var(--text-faint); margin-top:4px;">' + esc(v.title) + '</div>'
          + '</div>';
      }
      html += '</div>';
    } else {
      html += '<div class="version-entry"><div class="version-num version-current">v1 (current)</div>'
        + '<div class="version-date">' + timeAgo((versions[0] || {}).approved_at || (versions[0] || {}).submitted_at) + '</div>'
        + '<div style="font-size:14px; color:var(--text-faint); margin-top:4px;">Initial submission</div></div>';
    }

    html += '</div>';
    el.innerHTML = html;

    document.title = (cur.title || "Paper") + " — hellosenna.world";
  }

  loadPaper();

  // ── Hidden admin access (long-press nav brand) ──
  (function () {
    var timer = null;
    var el = document.querySelector(".nav-brand");
    if (!el) return;
    el.style.userSelect = "none";
    el.style.webkitUserSelect = "none";
    el.style.webkitTouchCallout = "none";
    el.addEventListener("mousedown", function () { timer = setTimeout(function () { window.location.href = "/admin.html"; }, 800); });
    el.addEventListener("mouseup", function () { clearTimeout(timer); });
    el.addEventListener("mouseleave", function () { clearTimeout(timer); });
    el.addEventListener("touchstart", function () { timer = setTimeout(function () { window.location.href = "/admin.html"; }, 800); }, { passive: true });
    el.addEventListener("touchend", function () { clearTimeout(timer); });
    el.addEventListener("touchcancel", function () { clearTimeout(timer); });
  })();
})();
</script>
</body>
</html>
